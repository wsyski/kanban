<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roman Evaluator</title>
  <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="container py-4">
  <h1 class="h3 mb-3">Roman Evaluator</h1>

  <div class="mb-3">
    <input
      type="text"
      id="roman-input"
      class="form-control"
      placeholder="Enter a Roman numeral, e.g. XIV"
      autocomplete="off"
      spellcheck="false">
  </div>

  <div class="d-flex gap-2 mb-3">
    <button type="button" id="evaluate-btn" class="btn btn-primary">Evaluate</button>
    <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
  </div>

  <div id="display" class="list-group"></div>

  <script type="module" src="./roman.js"></script>
</body>
</html>
