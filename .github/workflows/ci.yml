name: kanban-engine

# The same commands the README's receipts name, so CI and a human run one thing. The suite
# is seconds, and the diagram check is what catches a card-graph edit that forgot its
# pictures — both were previously run only when someone remembered.
on:
  push:
    branches: [main]
  pull_request:
  # Actions → "Run workflow" → pick any branch: a refactor branch wants the same suite
  # before it is merged, and that is exactly when a push trigger cannot help.
  workflow_dispatch:
    inputs:
      llm:
        description: "Also run the LLM-gated integration tests on the self-hosted runner"
        type: boolean
        default: false
      k:
        description: "pytest -k filter for the LLM job, e.g. planted (empty = every case)"
        type: string
        default: ""

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: pytest (test.sh runs it, and the suite needs an interpreter that has it)
        run: python3 -m pip install --quiet -r requirements-test.txt

      # PYTHON pins the interpreter: test.sh otherwise probes /usr/bin/python3 first, which
      # on a runner is the system python without pytest.
      - name: engine suite
        env:
          PYTHON: python3
        run: ./test.sh

      - name: diagrams still match the card graph
        run: python3 driver/render-flow.py --check

      # --any-host: the runner is not the board's host, so an owner's absolute
      # default-workdir cannot exist here; the declaration is what this checks.
      - name: every shipped board validates against the option schema
        run: |
          for b in boards/*/board.json; do
            python3 template/board_schema.py --any-host "$b"
          done

  # Needs the workstation's local model (swift15-27b via llama-swap) and the `hermes` CLI,
  # which no hosted runner has. Manual only: a self-hosted runner must never execute a
  # pull request's code. Register the runner with the `kanban-llm` label (README).
  llm:
    if: github.event_name == 'workflow_dispatch' && inputs.llm
    runs-on: [self-hosted, linux, kanban-llm]
    # A protected environment: add required reviewers to `kanban-llm` under Settings →
    # Environments and every run waits for an approval before it touches the workstation.
    environment: kanban-llm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: LLM-gated integration tests
        env:
          KANBAN_LLM_TESTS: "1"
          KANBAN_RUN_CARD_REPEAT: "1"
          KFILTER: ${{ inputs.k }}
          TEST_PATHS: tests/integration        # the fast suite already ran in `suite`
        run: |
          if [ -n "$KFILTER" ]; then ./test.sh -rs -k "$KFILTER"; else ./test.sh -rs; fi
