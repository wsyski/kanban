name: engine

# The same commands the README's receipts name, so CI and a human run one thing. The suite
# is seconds, and the diagram check is what catches a card-graph edit that forgot its
# pictures — both were previously run only when someone remembered.
on:
  push:
    branches: [main]
  pull_request:
  # Actions → "Run workflow" → pick any branch: a refactor branch wants the same suite
  # before it is merged, and that is exactly when a push trigger cannot help.
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: pytest (test.sh runs it, and the suite needs an interpreter that has it)
        run: python3 -m pip install --quiet pytest

      # PYTHON pins the interpreter: test.sh otherwise probes /usr/bin/python3 first, which
      # on a runner is the system python without pytest.
      - name: engine suite
        env:
          PYTHON: python3
        run: ./test.sh

      - name: diagrams still match the card graph
        run: python3 driver/render-flow.py --check

      # --any-host: the runner is not the board's host, so an owner's absolute
      # default-workdir cannot exist here; the declaration is what this checks.
      - name: every shipped board validates against the option schema
        run: |
          for b in boards/*/board.json; do
            python3 template/board_schema.py --any-host "$b"
          done
