[pytest]
# Bare `pytest` from the repo root used to collect boards/<slug>/work.*/test_*.py — the
# per-model trees a run leaves for comparison, which on is-even hold a real
# `test_is_even.py` — and died with 76 collection errors before running a single engine
# test (2026-10-03). `./test.sh` passes an absolute tests/ path, which overrides
# `testpaths`, so the suite itself is unaffected; this is for the bare invocation.
testpaths = tests
norecursedirs = boards .git .idea .pytest_cache node_modules build dist *.egg-info docs
